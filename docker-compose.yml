# One-shot loop runner. Host systemd fires `docker compose run --rm loop-runner ...`.
# NO scheduler inside the container — the host owns scheduling + locking.
#
# State lives in Neon Postgres (DATABASE_URL in .env), reached over the internet — the runner needs
# only outbound network access (the default bridge), no shared docker network. GSC / PSI / Anthropic /
# WP MCP and the optional CodeManager broker are all reached the same way.

services:
  loop-runner:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: seo-loops:latest
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports          # committed md history (dashboard-lite)
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./secrets/gsc_sa.json:/run/secrets/gsc_sa.json:ro   # GSC service account, gitignored
    # no `command:` here — provided per-invocation by systemd, e.g.:
    #   docker compose run --rm loop-runner python -m scripts.run_loop_b
    restart: "no"

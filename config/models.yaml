# Model routing + provider definitions for the agent step. NON-SECRET (committed, public-safe).
# API keys live in .env, referenced by api_key_env below. Local runtimes (Ollama, vLLM,
# LM Studio) speak the OpenAI wire format and need no key.
#
# The agent step is structured-JSON generation, not an agentic tool loop, so ANY model that
# can return JSON works — including local ones. Swap freely; the bake-off scores candidates.
#
# BILLING — the reason claude_cli is the production default:
#   claude_cli -> the Claude Code CLI on the Pro/Max SUBSCRIPTION. No API dollars.
#   anthropic  -> the Messages API. METERED. Only route here deliberately.
#   ollama     -> local. Free, private, no meter at all.

providers:
  claude_cli:
    kind: claude_cli                    # `claude -p` — subscription auth, no API key
    timeout_s: 300
  anthropic:
    kind: anthropic                     # METERED — direct Messages API
    api_key_env: ANTHROPIC_API_KEY
  openai:
    kind: openai                        # OpenAI-compatible wire format
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  ollama:
    kind: openai                        # local — Ollama's OpenAI-compatible endpoint
    base_url: http://localhost:11434/v1
    api_key_env: null                   # local, no key
    # Model tags below are all `-seo` variants (see deploy/ollama/) with num_ctx PINNED via a
    # Modelfile, not the base tags. This endpoint silently drops a per-request num_ctx —
    # verified 2026-08-24 on Ollama 0.32.7, both top-level and nested under `options` — so a
    # global context default set on this host for something else entirely (e.g. another tool
    # wanting a 64k window) would otherwise leak into every SEOMinder call too. Baking it into
    # the tag is the one mechanism Ollama actually honours regardless of which endpoint calls
    # it. Details + rebuild instructions: deploy/ollama/README.md.
  vllm:
    kind: openai                        # local — vLLM OpenAI server
    base_url: http://localhost:8000/v1
    api_key_env: null

# Production routing: task -> which model runs it.
routing:
  # Routed to the bake-off's local winner 2026-08-25, UNTIL FURTHER NOTICE, after claude-opus-5
  # reproduced the bake-off's documented failure on a real live run: 'tier' dropped from a
  # change object, ValidationError even after generate_json's repair round. claude_cli cannot
  # constrain decoding (no response_format schema), so it asks for the shape and validates
  # after; gemma4:31b gets it via constrained decoding on Ollama's /v1 and scored 3/3 JSON-valid
  # in the sweep (vs claude-opus-5's 0/3). See reports/bakeoff-loop_a_meta-2026-08-14.md.
  loop_a_meta: { provider: ollama, model: "gemma4:31b-seo" }
  loop_b_rank: { provider: claude_cli, model: claude-sonnet-5 }  # ranking + rationale

# Sampling parameters, matched to a model by LONGEST PREFIX (scripts.models.sampling_for).
# Families are post-trained at different settings and borrowing one family's defaults for
# another is a standard reason a model underperforms its benchmarks. Driving a model tuned
# for temperature 1.0 at 0 invites degenerate repetition, which would surface here as poor
# title/description *distinctness* — the metric Loop A's one-call design exists to satisfy.
#
# Applies to the `openai` provider kind only. Current Claude models reject temperature /
# top_p / top_k with a 400, and the CLI exposes no sampling knobs, so both Anthropic paths
# ignore this block. `extra_body` carries anything outside the OpenAI schema (top_k is added
# there automatically; per-family thinking toggles go there too).
# Family blocks OVERLAY `default`, they do not replace it — so the thinking suppression and
# its assertion are declared once here and inherited everywhere.
sampling:
  default:
    temperature: 0.7
    top_p: 0.9
    # These tasks are structured extraction, not open reasoning. Thinking here buys nothing
    # and costs the output budget the 11-page batch needs. Measured 2026-08-13, trivial probe:
    #   gemma4:26b  15.4s / 144c reasoning  ->  0.9s / 0c with this set
    #   gemma4:31b  34.4s / 215c            ->  see preflight
    #   qwen3.6:27b 58.2s / 607c            ->  28.9s / 0c
    # Ollama silently drops parameters it does not recognise, so `expect_no_reasoning` makes
    # preflight PROVE the toggle applied instead of assuming it did.
    extra_body:
      reasoning_effort: "none"
    expect_no_reasoning: true
  gemma4:
    temperature: 1.0
    top_p: 0.95
    top_k: 64
  qwen3.6:
    # Qwen3.6 dropped the /think soft switch, so thinking must be disabled by request param.
    # WHICH param depends on the RUNTIME, and getting it wrong fails silently:
    #   vLLM   -> extra_body.chat_template_kwargs.enable_thinking: false
    #   Ollama -> extra_body.reasoning_effort: "none"   <- what we run (ollama provider)
    # chat_template_kwargs is a vLLM convention; Ollama's /v1 layer ignores unknown keys, so
    # setting it here produced NO error — the model just kept thinking, burned the whole
    # max_tokens budget on reasoning, and returned empty content with finish_reason=length.
    # That scores as a schema failure and reads as "the model is bad at JSON" when the model
    # is fine. Verified 2026-08-11: with reasoning_effort none the probe returns clean JSON in
    # 6.5s; without it, 22s and empty. Re-check this line if the ollama provider ever moves to
    # vLLM, and run scripts.models.preflight after any change here.
    # These are its NON-thinking values — switch to temp 1.0 / top_p 0.95 / presence 0.0
    # if you enable thinking (worth testing on loop_b_rank, which is pure analysis).
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
    extra_body:
      reasoning_effort: "none"
    # Not an API parameter — read by models.preflight, which then PROVES the toggle applied by
    # requiring zero reasoning characters in the reply. Measured 2026-08-13 on Ollama 0.32.7:
    # no toggle -> 607 chars; chat_template_kwargs -> 348 (a no-op); reasoning_effort none -> 0.
    # A deliberately invalid parameter also produced no error, which is why we assert instead
    # of assuming.
    expect_no_reasoning: true
  llama3.1:
    temperature: 0.7
    top_p: 0.9

# Bake-off candidates to score per task (scripts.models.candidates_for(task)).
# `-mlx` variants exist for the gemma4/qwen3.6 tags and are worth a second pass on Apple
# Silicon; GGUF vs MLX footprints differ per model, so check both before deciding.
# llama3.1:8b stays as a control — we already have baseline numbers for it.
bakeoff:
  loop_a_meta:
    - { provider: claude_cli, model: claude-opus-5 }
    - { provider: claude_cli, model: claude-sonnet-5 }
    - { provider: ollama,     model: "gemma4:31b-seo" }
    - { provider: ollama,     model: "gemma4:26b-seo" }
    - { provider: ollama,     model: "qwen3.6:27b-seo" }
    - { provider: ollama,     model: "llama3.1:8b-seo" }
  loop_b_rank:
    - { provider: claude_cli, model: claude-sonnet-5 }
    - { provider: ollama,     model: "qwen3.6:27b-seo" }
    - { provider: ollama,     model: "gemma4:26b-seo" }
    - { provider: ollama,     model: "gemma4:31b-seo" }
    - { provider: ollama,     model: "llama3.1:8b-seo" }
